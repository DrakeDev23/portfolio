name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        env:
          RENDER_HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
        run: |
          if [ -z "$RENDER_HEALTH_URL" ]; then
            echo "::error::RENDER_HEALTH_URL secret is not set"
            exit 1
          fi
          curl --fail --silent --show-error --location \
               --max-time 60 --retry 3 --retry-delay 10 --retry-all-errors \
               "$RENDER_HEALTH_URL"
